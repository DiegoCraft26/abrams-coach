# Integración continua real: se ejecuta en cada push y en cada PR.
# Lo que corre aquí es lo mismo que corre un contribuidor en su máquina, incluida la
# puerta de pintado de la UI bajo Xvfb.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dependencias del sistema (GTK4, PyGObject, Tesseract, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev pkg-config python3-dev \
            libgtk-4-1 gir1.2-gtk-4.0 xvfb tesseract-ocr sqlite3

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pygobject pytest

      - name: Compilación completa
        run: python -m compileall -q coach herramientas tests run.py panel_nativo.py

      - name: Arte de Deadlock (no versionado, se baja en runtime)
        run: python3 coach/iconos.py

      - name: Suite completa (incluye la UI bajo Xvfb)
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a python -m pytest -q

      - name: Invariantes del motor
        run: python tests/test_invariantes.py

      - name: A/B del motor sobre muestra versionada
        run: |
          python herramientas/evaluar_motor.py \
            --cache data/replay_muestra.json \
            --partidas 60 --max-estados 800 \
            --salida /tmp/evaluacion-ci.json

      - name: Camino de build (sin abusar de los 800)
        run: |
          python herramientas/validar_camino.py \
            --cache data/replay_muestra.json --partidas 60

      - name: Archivado idempotente
        run: |
          python herramientas/archivar.py --db /tmp/ci.db | tee /tmp/archivo-1.txt
          python herramientas/archivar.py --db /tmp/ci.db | tee /tmp/archivo-2.txt
          python - <<'PY'
          import sqlite3

          texto = open("/tmp/archivo-2.txt", encoding="utf-8").read()
          sucias = [l for l in texto.splitlines()
                    if "filas nuevas" in l and not l.endswith(": 0 filas nuevas")]
          assert not sucias, f"la segunda pasada agregó filas: {sucias}"
          db = sqlite3.connect("/tmp/ci.db")
          tablas = {r[0] for r in db.execute(
              "select name from sqlite_master where type='table'")}
          faltan = {"partidas", "muestras", "recomendaciones", "compras"} - tablas
          assert not faltan, f"faltan tablas: {faltan}"
          print("archivado idempotente: ok")
          PY
